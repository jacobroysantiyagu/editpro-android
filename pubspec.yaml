publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  video_player: ^2.8.1
  just_audio: ^0.9.36
  file_picker: ^6.1.1
